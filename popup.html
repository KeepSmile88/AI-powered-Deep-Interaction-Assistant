<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 400px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            background: #f8f9fa;
        }
        .section h3 {
            margin: 0 0 10px 0;
            color: #495057;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #6c757d;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 12px;
            box-sizing: border-box;
        }
        textarea {
            height: 60px;
            resize: vertical;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .checkbox-group input[type="checkbox"] {
            width: auto;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            margin: 5px 0;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        .status {
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            margin: 10px 0;
        }
        .status.active {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.inactive {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .keyword-tag {
            display: inline-block;
            background: #e9ecef;
            padding: 2px 6px;
            margin: 2px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
        }
        .btn-export {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 12px;
            margin: 3px 0;
        }
        .btn-export:hover {
            background: #218838;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 12px;
            margin: 3px 0;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .conversation-stats {
            display: flex;
            justify-content: space-between;
            background: #e9ecef;
            padding: 8px;
            border-radius: 4px;
            font-size: 11px;
            color: #495057;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>🤖 AI智能交互助手</h2>
    </div>

    <div class="status inactive" id="status">
        插件未激活
    </div>

    <div class="section">
        <h3>🎯 交互模式</h3>
        <div class="input-group">
            <label>选择交互策略:</label>
            <select id="interactionMode">
                <option value="keywords">关键词驱动</option>
                <option value="intelligent">智能探索</option>
                <option value="mixed">混合模式</option>
            </select>
        </div>
        
        <div class="input-group">
            <label>回复延迟 (秒):</label>
            <input type="number" id="replyDelay" value="3" min="1" max="30">
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="deepExploration">
            <label for="deepExploration">启用深度探索</label>
        </div>
    </div>

    <div class="section">
        <h3>📝 自定义关键词</h3>
        <div class="input-group">
            <label>添加关键词 (用逗号分隔):</label>
            <textarea id="customKeywords" placeholder="例如: 详细解释, 举个例子, 更深入, 还有什么, 原理是什么"></textarea>
        </div>
        <div id="keywordTags"></div>
    </div>

    <div class="section">
        <h3>🧠 智能提示词</h3>
        <div class="input-group">
            <label>探索方向:</label>
            <select id="explorationDirection">
                <option value="deeper">更深入分析</option>
                <option value="broader">扩展相关话题</option>
                <option value="practical">实际应用</option>
                <option value="theoretical">理论基础</option>
                <option value="comparative">对比分析</option>
            </select>
        </div>
        
        <div class="checkbox-group">
            <input type="checkbox" id="contextAware">
            <label for="contextAware">上下文感知</label>
        </div>
    </div>

    <div class="section">
        <h3>⚙️ 高级设置</h3>
        <div class="input-group">
            <label>最大交互轮数:</label>
            <input type="number" id="maxRounds" value="10" min="1" max="50">
        </div>
        
        <div class="input-group">
            <label>停止关键词 (用逗号分隔):</label>
            <input type="text" id="stopKeywords" placeholder="例如: 结束, 停止, 够了">
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="autoExport">
            <label for="autoExport">会话结束后自动导出</label>
        </div>
    </div>

    <div class="section">
        <h3>📄 对话管理</h3>
        <div class="input-group">
            <label>当前会话统计:</label>
            <div class="conversation-stats">
                <span id="messageCount">消息: 0</span>
                <span id="sessionDuration">时长: 0分钟</span>
            </div>
        </div>
        
        <div class="input-group">
            <label>导出格式:</label>
            <select id="exportFormat">
                <option value="markdown">Markdown (.md)</option>
                <option value="html">HTML (.html)</option>
                <option value="txt">纯文本 (.txt)</option>
                <option value="json">JSON (.json)</option>
            </select>
        </div>

        <button id="exportBtn" class="btn-export">📥 导出当前对话</button>
        <button id="exportAllBtn" class="btn-export">📚 导出历史对话</button>
        <button id="clearHistoryBtn" class="btn-danger">🗑️ 清除历史</button>
    </div>

    <button id="toggleBtn">启动智能交互</button>
    <button id="pauseBtn" disabled>暂停</button>
    <button id="resetBtn">重置设置</button>

    <script src="popup.js"></script>
</body>
</html>
